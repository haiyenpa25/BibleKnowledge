<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pageGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="4" />
  
  <!-- Neural Network Connections -->
  <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="3">
    <line x1="112" y1="138" x2="256" y2="102" />
    <line x1="256" y1="102" x2="400" y2="138" />
    <line x1="112" y1="138" x2="149" y2="362" />
    <line x1="400" y1="138" x2="362" y2="362" />
    <line x1="256" y1="102" x2="256" y2="240" />
  </g>
  <circle cx="112" cy="138" r="9" fill="#38bdf8" />
  <circle cx="256" cy="102" r="12" fill="#60a5fa" filter="url(#glow512)" />
  <circle cx="400" cy="138" r="9" fill="#38bdf8" />

  <!-- Open Bible Pages -->
  <path d="M256 181 C213 165 128 170 96 192 L96 378 C133 357 218 357 256 378 C294 357 379 357 416 378 L416 192 C384 170 299 165 256 181 Z" fill="url(#pageGrad512)" filter="url(#glow512)" />
  <!-- Book Spine Center -->
  <line x1="256" y1="181" x2="256" y2="378" stroke="#64748b" stroke-width="5" />
  
  <!-- Golden Cross on Book -->
  <g fill="url(#goldGrad512)">
