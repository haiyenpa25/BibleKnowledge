<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Neural Network Connections -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="42" y1="52" x2="96" y2="38" />
    <line x1="96" y1="38" x2="150" y2="52" />
    <line x1="42" y1="52" x2="56" y2="136" />
    <line x1="150" y1="52" x2="136" y2="136" />
    <line x1="96" y1="38" x2="96" y2="90" />
  </g>
  <circle cx="42" cy="52" r="3.5" fill="#38bdf8" />
  <circle cx="96" cy="38" r="4.5" fill="#60a5fa" filter="url(#glow)" />
  <circle cx="150" cy="52" r="3.5" fill="#38bdf8" />

  <!-- Open Bible Pages -->
  <path d="M96 68 C80 62 48 64 36 72 L36 142 C50 134 82 134 96 142 C110 134 142 134 156 142 L156 72 C144 64 112 62 96 68 Z" fill="url(#pageGrad)" filter="url(#glow)" />
  <!-- Book Spine Center -->
  <line x1="96" y1="68" x2="96" y2="142" stroke="#64748b" stroke-width="2" />
  
  <!-- Golden Cross on Book -->
  <g fill="url(#goldGrad)">
    <rect x="92" y="80" width="8" height="38" rx="2" />
    <rect x="80" y="88" width="32" height="7" rx="2" />
  </g>
</svg>
