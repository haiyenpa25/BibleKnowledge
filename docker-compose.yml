services:
  # ============================================================================
  # 1. PostgreSQL 16 + pgvector Database
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bibleknowledge-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bible_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bible_knowledge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # ============================================================================
  # 2. Ollama Local LLM Engine (NVIDIA GPU Passthrough)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: bibleknowledge-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1536M
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================================================
  # 3. FastAPI AI & RAG Engine
  # ============================================================================
  api-ai:
    build:
      context: ./services/api-ai
      dockerfile: Dockerfile
    container_name: bibleknowledge-api-ai
    restart: unless-stopped
    ports:
      - "${API_AI_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:bible_secure_pass_2026@postgres:5432/bible_knowledge}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ./services/api-ai:/app
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ============================================================================
  # 4. Next.js 15 Web Application
  # ============================================================================
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: bibleknowledge-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./services/web:/app
      - /app/node_modules
    depends_on:
      api-ai:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

volumes:
  postgres_data:
    name: bibleknowledge_postgres_data
  ollama_data:
    name: bibleknowledge_ollama_data
